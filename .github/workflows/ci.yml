name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: {python-version: "${{ matrix.python }}"}
      # Includes tests/test_docs.py: every README and docs/ command, run in a fresh repo with the network blocked.
      - run: python -W error -m unittest discover -s tests -v
      - run: python -m compileall -q skill install.py configure_hooks.py tools
      - name: Generated agent files are up to date
        run: python tools/make_agents.py --check
      - name: Generated docs (docs/cli.md, docs/troubleshooting.md) are up to date
        run: python tools/gen_cli_docs.py --check
      - name: README screenshot matches the dashboard HTML
        run: python tools/screenshot.py --check
      - name: Clean install smoke test
        run: |
          d=$(mktemp -d)
          python install.py --platform both --project "$d"
          test -z "$(find "$d" -name '*.pyc' -o -name __pycache__)"
  wheel:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: {python-version: "${{ matrix.python }}"}
      - name: Build the wheel and install it into a clean venv
        run: |
          python -m pip wheel . --no-deps -w dist
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl
      - name: Wheel ships the assets, templates and references
        shell: python
        run: |
          import glob, pathlib, zipfile
          names = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          need = ["SKILL.md", "assets/mission-control.html", "assets/evaluation-template.json", "assets/portfolio-template.json"]
          need += [f"references/{p.name}" for p in pathlib.Path("skill/references").glob("*.md")]
          missing = [n for n in need if "greenfield_evaluator/" + n not in names]
          assert not missing, missing
          assert not [n for n in names if n.endswith(".pyc")]
      - name: The installed command runs outside the repo
        run: |
          d=$(mktemp -d) && cd "$d"
          gf="$RUNNER_TEMP/venv/bin/greenfield"
          "$gf" --version
          "$gf" demo
          "$gf" --json status | python -c 'import json, sys; json.load(sys.stdin)'
          "$gf" install --no-gitignore >/dev/null && test -f .claude/agents/gf-market.md
          # fresh install, no hooks or run: only the .gitignore failure is expected, and --fix repairs it
          "$gf" doctor --fix --json | python -c 'import json, sys; d = json.load(sys.stdin); assert d["summary"]["fail"] == 0, d'
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: {python-version: "3.13"}
      # W26: native Windows has no fcntl; only the locking-refusal and read-only command classes run here.
      - run: cd tests && python -W error -m unittest test_platform.WindowsLockingCommands test_platform.WindowsReadOnlyCommands -v
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: {python-version: "3.13"}
      # Skipped until W7 adds tests/test_fuzz.py.
      - if: hashFiles('tests/test_fuzz.py') != ''
        run: GF_FUZZ_ITERATIONS=20000 python -m unittest tests.test_fuzz -v
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: {python-version: "3.13"}
      # Test-only dependency; the runtime stays standard library only.
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: mkdir -p shots && GF_REQUIRE_BROWSER=1 GF_SCREENSHOT_DIR=shots python -m unittest tests.test_dashboard_browser -v
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with: {name: mission-control-screenshots, path: shots/}
