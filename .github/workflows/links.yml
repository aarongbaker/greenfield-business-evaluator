name: External links
on:
  schedule:
    - cron: "17 6 * * 1"  # weekly, Monday 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.13"}
      # Opens (or comments on) an issue instead of failing: external sites break on their own schedule, not on our PRs.
      - name: Check external links in README and docs/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python tests/test_docs.py --external > broken.md; then cat broken.md; exit 0; fi
          cat broken.md
          title="Broken external links in the docs"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file broken.md; else gh issue create --title "$title" --body-file broken.md; fi
